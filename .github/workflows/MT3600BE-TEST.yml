name: MT3600BE-TEST

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: "OpenWrt 源码分支（通常保持 main）"
        required: true
        default: main
        type: string
      openwrt_ref:
        description: "固定 OpenWrt 源码提交或标签（留空则跟随上述分支最新版本）"
        required: false
        default: ''
        type: string
      pin_mt76_known_good:
        description: "使用已验证的稳定版 mt76 WiFi 驱动（推荐；取消勾选则使用 OpenWrt 主线驱动）"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      wrt_config: MT3600BE
      wrt_name: GL-MT3600BE TEST
      wrt_device_name: glinet_gl-mt3600be
      wrt_device_dts: mt7987a-glinet-gl-mt3600be
      wrt_theme: aurora
      wrt_branch: ${{ inputs.openwrt_branch }}
      wrt_ref: ${{ inputs.openwrt_ref }}
      feeds_profile: immortalwrt-compatible
      pin_mt76_known_good: ${{ inputs.pin_mt76_known_good }}
      cleanup_runner: true
      publish_release: false
      test_only: true
