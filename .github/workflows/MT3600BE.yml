name: MT3600BE

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: "OpenWrt 源码分支（通常保持 main）"
        required: true
        default: main
        type: string
      openwrt_ref:
        description: "固定 OpenWrt 源码提交或标签（留空则跟随上述分支最新版本）"
        required: false
        default: ''
        type: string
      pin_mt76_known_good:
        description: "使用已验证的稳定版 mt76 WiFi 驱动（推荐；取消勾选则使用 OpenWrt 主线驱动）"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/MT3600BE.yml
      - .github/workflows/WRT-CORE.yml
      - Config/**
      - Patches/**
      - Scripts/**
      - files/**

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      wrt_config: MT3600BE
      wrt_name: GL-MT3600BE
      wrt_device_name: glinet_gl-mt3600be
      wrt_device_dts: mt7987a-glinet-gl-mt3600be
      wrt_theme: aurora
      wrt_branch: ${{ inputs.openwrt_branch || 'main' }}
      # 中文：默认跟随 OpenWrt 分支最新；只有需要临时回退/二分上游问题时才手动填写 openwrt_ref。
      wrt_ref: ${{ inputs.openwrt_ref || '' }}
      feeds_profile: immortalwrt-compatible
      # 中文：手动构建服从勾选项；push 自动构建使用已验证 mt76，避免发布无线易假死的日常固件。
      pin_mt76_known_good: ${{ github.event_name == 'workflow_dispatch' && inputs.pin_mt76_known_good || github.event_name == 'push' }}
      # 中文：完整构建始终释放 Runner 空间并发布预发行版；仅检查配置请使用 MT3600BE-TEST。
      cleanup_runner: true
      publish_release: true
